<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Central de Iluminação IoT (3 LEDs)</title>
  
  <!-- Paho MQTT via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #d4eaff 0%, #f0f9ff 100%);
      padding: 1.5rem;
    }

    /* Card Principal */
    .glass-card {
      max-width: 850px;
      width: 100%;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25), 0 8px 24px -6px rgba(0, 40, 80, 0.08);
      padding: 2rem 2.2rem;
    }

    /* Cabeçalho */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 0.5rem;
    }

    .title-main {
      font-size: 1.8rem;
      font-weight: 600;
      color: #0b2b44;
      line-height: 1.2;
    }

    .title-sub {
      font-size: 0.9rem;
      color: #3d5a73;
      opacity: 0.8;
      margin-top: 0.1rem;
    }

    /* Pill de Status */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.6);
      padding: 0.45rem 1.1rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      font-weight: 500;
      color: #1e2f3f;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fbbf24;
      transition: all 0.3s ease;
    }

    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }

    .status-dot.sync {
      background: #fbbf24;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.6; }
    }

    /* Campo de Tópico */
    .topic-area {
      margin-bottom: 1.5rem;
    }

    .topic-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #2c4b66;
      margin-bottom: 0.4rem;
    }

    .topic-input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 60px;
      font-size: 0.95rem;
      color: #0b2b44;
      outline: none;
      transition: all 0.2s;
    }

    .topic-input:focus {
      border-color: #7aa9d9;
      background: rgba(255, 255, 255, 0.9);
    }

    /* Grid com Controles dos 3 LEDs */
    .leds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-top: 1rem;
    }

    .led-card {
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 1.5rem;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .led-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0b2b44;
    }

    .led-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #cbdde9;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: #3a5a72;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Cores quando ativados */
    .led-circle.active-led1 {
      background: #ef4444;
      color: white;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
    }

    .led-circle.active-led2 {
      background: #10b981;
      color: white;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
    }

    .led-circle.active-led3 {
      background: #3b82f6;
      color: white;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.8);
    }

    /* Botões */
    .actions {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 0.65rem 0.5rem;
      border: none;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 600;
      color: white;
      background: #b0c9dd;
      cursor: not-allowed;
      opacity: 0.5;
      transition: all 0.2s ease;
    }

    .btn.enabled {
      cursor: pointer;
      opacity: 1;
    }

    .btn.enabled:active {
      transform: scale(0.95);
    }

    .btn-on { background: #2d8f6f; }
    .btn-on.enabled:hover { background: #1f7a5d; }

    .btn-off { background: #bf7a7a; }
    .btn-off.enabled:hover { background: #ac6363; }

    /* Caixa de Logs / Terminal */
    .log-box {
      margin-top: 1.5rem;
      width: 100%;
      background-color: #1e1e1e;
      color: #00ff66;
      font-family: monospace;
      padding: 12px;
      border-radius: 12px;
      height: 120px;
      overflow-y: auto;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<div class="glass-card">
  <!-- Cabeçalho -->
  <div class="header">
    <div class="title-group">
      <span class="title-main">💡 Central IoT Multi-LED</span>
      <span class="title-sub">Controle de Hardware · Portas 13, 12 e 11</span>
    </div>
    <div class="status-pill">
      <span class="status-dot sync" id="statusDot"></span>
      <span class="status-text" id="statusText">Sincronizando...</span>
    </div>
  </div>

  <!-- Tópico MQTT -->
  <div class="topic-area">
    <label class="topic-label" for="topicInput">📡 Tópico MQTT</label>
    <input class="topic-input" id="topicInput" type="text" value="bruno_correa_led_exclusivo/arduino" spellcheck="false">
  </div>

  <!-- Grid de LEDs -->
  <div class="leds-grid">
    <!-- LED 1 -->
    <div class="led-card">
      <span class="led-title">LED 1 (Pino 13)</span>
      <div class="led-circle" id="ledCircle1">Desligado</div>
      <div class="actions">
        <button class="btn btn-on btn-control" data-cmd="1" disabled>🔛 LIGAR</button>
        <button class="btn btn-off btn-control" data-cmd="0" disabled>⏻ DESLIGAR</button>
      </div>
    </div>

    <!-- LED 2 -->
    <div class="led-card">
      <span class="led-title">LED 2 (Pino 12)</span>
      <div class="led-circle" id="ledCircle2">Desligado</div>
      <div class="actions">
        <button class="btn btn-on btn-control" data-cmd="11" disabled>🔛 LIGAR</button>
        <button class="btn btn-off btn-control" data-cmd="00" disabled>⏻ DESLIGAR</button>
      </div>
    </div>

    <!-- LED 3 -->
    <div class="led-card">
      <span class="led-title">LED 3 (Pino 11)</span>
      <div class="led-circle" id="ledCircle3">Desligado</div>
      <div class="actions">
        <button class="btn btn-on btn-control" data-cmd="111" disabled>🔛 LIGAR</button>
        <button class="btn btn-off btn-control" data-cmd="000" disabled>⏻ DESLIGAR</button>
      </div>
    </div>
  </div>

  <!-- Terminal de Monitoramento -->
  <div class="log-box" id="logBox">
    > Conectando ao sistema...<br>
  </div>
</div>

<script>
  (function() {
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const topicInput = document.getElementById('topicInput');
    const controlButtons = document.querySelectorAll('.btn-control');
    const logBox = document.getElementById('logBox');

    const ledCircle1 = document.getElementById('ledCircle1');
    const ledCircle2 = document.getElementById('ledCircle2');
    const ledCircle3 = document.getElementById('ledCircle3');

    let currentTopic = topicInput.value.trim();
    let client = null;
    let isConnected = false;

    function addLog(msg) {
      const hora = new Date().toLocaleTimeString();
      logBox.innerHTML += `[${hora}] ${msg}<br>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(mode, msg) {
      statusDot.className = 'status-dot ' + mode;
      statusText.textContent = msg;
    }

    function setButtonsEnabled(enabled) {
      controlButtons.forEach(btn => {
        btn.disabled = !enabled;
        btn.classList.toggle('enabled', enabled);
      });
    }

    function updateLedUI(payload) {
      if (payload === '1') { ledCircle1.className = 'led-circle active-led1'; ledCircle1.textContent = 'Ligado'; }
      if (payload === '0') { ledCircle1.className = 'led-circle'; ledCircle1.textContent = 'Desligado'; }

      if (payload === '11') { ledCircle2.className = 'led-circle active-led2'; ledCircle2.textContent = 'Ligado'; }
      if (payload === '00') { ledCircle2.className = 'led-circle'; ledCircle2.textContent = 'Desligado'; }

      if (payload === '111') { ledCircle3.className = 'led-circle active-led3'; ledCircle3.textContent = 'Ligado'; }
      if (payload === '000') { ledCircle3.className = 'led-circle'; ledCircle3.textContent = 'Desligado'; }
    }

    function connectMqtt() {
      if (client) {
        try { client.disconnect(); } catch (_) {}
      }

      const clientId = 'web_' + Math.random().toString(16).substring(2, 10);
      client = new Paho.MQTT.Client('broker.hivemq.com', 8884, clientId);

      client.connect({
        useSSL: true,
        timeout: 10,
        onSuccess: () => {
          isConnected = true;
          setStatus('online', 'Sistema Online');
          setButtonsEnabled(true);
          addLog("Conectado com sucesso ao Broker HiveMQ!");
          client.subscribe(currentTopic);
        },
        onFailure: (err) => {
          isConnected = false;
          setStatus('offline', 'Falha na conexão');
          setButtonsEnabled(false);
          addLog("Erro na conexão: " + err.errorMessage);
          setTimeout(connectMqtt, 5000);
        }
      });

      client.onConnectionLost = (res) => {
        isConnected = false;
        setStatus('offline', 'Conexão Perdida');
        setButtonsEnabled(false);
        addLog("Conexão perdida. Tentando reconectar...");
        setTimeout(connectMqtt, 4000);
      };

      client.onMessageArrived = (msg) => {
        const payload = msg.payloadString.trim();
        addLog(`Recebido no tópico: '${payload}'`);
        updateLedUI(payload);
      };
    }

    function publishCommand(cmd) {
      if (!client || !isConnected) return;
      const msg = new Paho.MQTT.Message(cmd);
      msg.destinationName = currentTopic;
      client.send(msg);
      addLog(`Enviado comando: '${cmd}'`);
      updateLedUI(cmd); // Atualização local imediata
    }

    // Eventos dos botões
    controlButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        publishCommand(this.getAttribute('data-cmd'));
      });
    });

    // Troca de Tópico Dinâmica
    topicInput.addEventListener('change', function() {
      const newTopic = this.value.trim();
      if (newTopic && newTopic !== currentTopic && isConnected) {
        client.unsubscribe(currentTopic);
        currentTopic = newTopic;
        client.subscribe(currentTopic);
        addLog(`Inscrito no novo tópico: '${currentTopic}'`);
      }
    });

    connectMqtt();
  })();
</script>
</body>
</html>
