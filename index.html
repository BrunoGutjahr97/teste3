<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Iluminação IoT - Arduino Porta 13</title>
    <!-- Tailwind CSS CDN -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <!-- Biblioteca Paho MQTT -->
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js](https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js)" type="text/javascript"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(0, 242, 254, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.4);
            }
            50% {
                box-shadow: 0 0 30px rgba(0, 242, 254, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.8);
            }
        }
        .led-active {
            animation: pulse-glow 2s infinite ease-in-out;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#e0f2fe] via-[#f0f9ff] to-[#ffffff] min-h-screen flex items-center justify-center p-4 font-sans text-slate-700">

    <!-- Container Principal com Glassmorphism -->
    <div class="w-full max-w-md bg-white/70 backdrop-blur-md border border-white/40 rounded-2xl shadow-xl p-6 sm:p-8 transition-all duration-300">
        
        <!-- Cabeçalho Minimalista -->
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight flex items-center justify-center gap-2">
                <i class="fa-solid fa-microchip text-sky-500"></i> Central de Iluminação IoT
            </h1>
            <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider">Controle de Hardware - Porta 13</p>
        </header>

        <!-- Status de Rede Inteligente (Pill) -->
        <div class="flex items-center justify-center mb-6">
            <div id="status-pill" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 shadow-sm transition-all duration-300">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
                <span id="status-text">Sincronizando...</span>
            </div>
        </div>

        <!-- Input Interativo de Tópico -->
        <div class="mb-6">
            <label for="topic-input" class="block text-xs font-medium text-slate-600 mb-1.5">Tópico MQTT Atual:</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-hashtag text-xs"></i>
                </span>
                <input type="text" id="topic-input" 
                    class="w-full pl-8 pr-3 py-2 bg-white/50 border border-slate-200 rounded-xl text-xs font-mono text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-transparent transition-all"
                    value="gerry_sanchez_led_exclusivo/arduino">
            </div>
        </div>

        <!-- Simulador do LED (Área de Pré-visualização) -->
        <div class="flex flex-col items-center justify-center bg-slate-50/50 border border-slate-100 rounded-2xl p-6 mb-6">
            <div id="virtual-led" class="w-20 h-20 rounded-full bg-slate-300 flex items-center justify-center transition-all duration-500 shadow-inner mb-3">
                <i class="fa-solid fa-lightbulb text-white/70 text-2xl"></i>
            </div>
            <span id="led-status-text" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Dispositivo Inativo</span>
        </div>

        <!-- Botões de Ação de Toque Suave -->
        <div class="grid grid-cols-2 gap-3">
            <button id="btn-on" onclick="publishMessage('1')" disabled
                class="py-3 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-medium text-sm shadow-md shadow-emerald-500/20 active:scale-95 transition-all disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none flex items-center justify-center gap-2">
                <i class="fa-solid fa-power-off text-xs"></i> LIGAR
            </button>
            <button id="btn-off" onclick="publishMessage('0')" disabled
                class="py-3 px-4 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-medium text-sm shadow-md shadow-rose-500/20 active:scale-95 transition-all disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none flex items-center justify-center gap-2">
                <i class="fa-solid fa-ban text-xs"></i> DESLIGAR
            </button>
        </div>

        <!-- Rodapé Discreto -->
        <footer class="text-center mt-6">
            <p class="text-[10px] text-slate-400">Broker: broker.hivemq.com (Porta 8884)</p>
        </footer>
    </div>

    <!-- Script de Lógica MQTT e Interatividade -->
    <script>
        // Configurações do Broker e Conexão
        const brokerHost = "broker.hivemq.com";
        const brokerPort = 8884; // Porta WebSocket Segura (WSS)
        
        // Gerar ClientID aleatório único
        const clientId = "web_iot_" + Math.random().toString(16).substring(2, 10);
        
        let client = null;
        let currentTopic = document.getElementById('topic-input').value;
        let previousTopic = currentTopic;

        const statusPill = document.getElementById('status-pill');
        const statusText = document.getElementById('status-text');
        const btnOn = document.getElementById('btn-on');
        const btnOff = document.getElementById('btn-off');
        const virtualLed = document.getElementById('virtual-led');
        const ledStatusText = document.getElementById('led-status-text');
        const topicInput = document.getElementById('topic-input');

        function initMQTT() {
            // Inicializar cliente Paho MQTT
            client = new Paho.MQTT.Client(brokerHost, Number(brokerPort), clientId);

            // Callbacks de Eventos
            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;

            // Opções de Conexão com SSL ativado
            const options = {
                timeout: 10,
                useSSL: true,
                onSuccess: onConnect,
                onFailure: onFailure
            };

            updateStatusUI("connecting");
            client.connect(options);
        }

        function onConnect() {
            console.log("Conectado com sucesso ao broker HiveMQ!");
            updateStatusUI("online");
            
            // Assinar o tópico inicial
            client.subscribe(currentTopic);
            console.igned(`Inscrito no tópico: ${currentTopic}`);
        }

        function onFailure(responseObject) {
            console.error("Falha na conexão:", responseObject.errorMessage);
            updateStatusUI("offline");
            // Tentar reconectar após 5 segundos
            setTimeout(initMQTT, 5000);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.warn("Conexão perdida:", responseObject.errorMessage);
                updateStatusUI("offline");
                // Tentar reconectar após 5 segundos
                setTimeout(initMQTT, 5000);
            }
        }

        // REGRA DE OURO DA ARQUITETURA: O LED só muda aqui baseado estritamente na mensagem da nuvem
        function onMessageArrived(message) {
            console.log(`Mensagem recebida no tópico [${message.destinationName}]: ${message.payloadString}`);
            
            const payload = message.payloadString.trim();
            
            if (payload === "1") {
                // Acender LED virtual
                virtualLed.className = "w-20 h-20 rounded-full flex items-center justify-center transition-all duration-500 shadow-inner mb-3 led-active";
                virtualLed.querySelector("i").className = "fa-solid fa-lightbulb text-white text-2xl drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]";
                ledStatusText.textContent = "Dispositivo Ativo";
                ledStatusText.className = "text-xs font-semibold text-sky-500 uppercase tracking-wider";
            } else if (payload === "0") {
                // Desligar LED virtual
                virtualLed.className = "w-20 h-20 rounded-full bg-slate-300 flex items-center justify-center transition-all duration-500 shadow-inner mb-3";
                virtualLed.querySelector("i").className = "fa-solid fa-lightbulb text-white/70 text-2xl";
                ledStatusText.textContent = "Dispositivo Inativo";
                ledStatusText.className = "text-xs font-semibold text-slate-400 uppercase tracking-wider";
            }
        }

        function publishMessage(payload) {
            if (client && client.isConnected()) {
                message = new Paho.MQTT.Message(payload);
                message.destinationName = currentTopic;
                client.send(message);
                console.log(`Comando '${payload}' publicado em ${currentTopic}`);
            } else {
                console.error("Erro: Cliente não conectado para envio.");
            }
        }

        function updateStatusUI(state) {
            if (state === "online") {
                statusPill.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-sm transition-all duration-300";
                statusPill.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span><span id="status-text">Sistema Online</span>';
                btnOn.removeAttribute('disabled');
                btnOff.removeAttribute('disabled');
            } else if (state === "connecting") {
                statusPill.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 shadow-sm transition-all duration-300";
                statusPill.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span><span id="status-text">Sincronizando...</span>';
                btnOn.setAttribute('disabled', 'true');
                btnOff.setAttribute('disabled', 'true');
            } else {
                statusPill.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200 shadow-sm transition-all duration-300";
                statusPill.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span><span id="status-text">Desconectado</span>';
                btnOn.setAttribute('disabled', 'true');
                btnOff.setAttribute('disabled', 'true');
            }
        }

        // Lógica de alteração dinâmica do tópico em tempo real
        topicInput.addEventListener('input', (e) => {
            const newTopic = e.target.value.trim();
            if (newTopic && newTopic !== currentTopic && client && client.isConnected()) {
                // Desinscrever do tópico antigo de forma invisível
                client.unsubscribe(previousTopic);
                console.log(`Desinscrito do tópico antigo: ${previousTopic}`);
                
                // Atualizar para o novo tópico e assinar
                currentTopic = newTopic;
                previousTopic = newTopic;
                client.subscribe(currentTopic);
                console.log(`Inscrito automaticamente no novo tópico: ${currentTopic}`);
            } else if (newTopic) {
                currentTopic = newTopic;
                previousTopic = newTopic;
            }
        });

        // Inicializar a aplicação ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            initMQTT();
        });
    </script>
</body>
</html>
