<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central IoT - 4 LEDs PWM + Potenciômetro</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #d4eaff, #f0f9ff); padding: 1.5rem; }
    .glass-card { max-width: 900px; width: 100%; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(14px); border-radius: 2rem; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 20px 40px rgba(0,20,40,0.2); padding: 2rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .title-main { font-size: 1.8rem; font-weight: 600; color: #0b2b44; }
    .status-pill { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(255, 255, 255, 0.8); padding: 0.4rem 1rem; border-radius: 60px; font-size: 0.85rem; font-weight: 500; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .status-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }

    /* VISOR DIGITAL DO POTENCIÔMETRO */
    .screen-container { background: #0f172a; border: 2px solid #334155; border-radius: 1.2rem; padding: 1.2rem; margin-bottom: 1.5rem; text-align: center; }
    .screen-label { color: #38bdf8; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; }
    .digital-display { font-family: monospace; font-size: 3rem; font-weight: 800; color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.6); margin: 0.2rem 0; }
    .progress-bar-bg { width: 100%; height: 10px; background: #1e293b; border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ef4444, #10b981, #3b82f6, #a855f7); transition: width 0.1s; }

    .master-controls { background: rgba(255, 255, 255, 0.7); border-radius: 1rem; padding: 1rem; margin-bottom: 1.5rem; text-align: center; border: 1px solid rgba(255,255,255,0.8); }
    
    /* GRID COM 4 LEDS */
    .leds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .led-card { background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 1.2rem; padding: 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.8rem; }
    .led-circle { width: 65px; height: 65px; border-radius: 50%; background: #cbdde9; display: flex; align-items: center; justify-content: center; transition: all 0.3s; color: #3a5a72; font-size: 0.75rem; font-weight: 600; }
    
    .led-circle.active-led1 { background: #ef4444; color: white; box-shadow: 0 0 18px rgba(239, 68, 68, 0.8); }
    .led-circle.active-led2 { background: #10b981; color: white; box-shadow: 0 0 18px rgba(16, 185, 129, 0.8); }
    .led-circle.active-led3 { background: #3b82f6; color: white; box-shadow: 0 0 18px rgba(59, 130, 246, 0.8); }
    .led-circle.active-led4 { background: #a855f7; color: white; box-shadow: 0 0 18px rgba(168, 85, 247, 0.8); }

    .actions { display: flex; gap: 0.4rem; width: 100%; }
    .btn { flex: 1; padding: 0.5rem; border: none; border-radius: 40px; font-size: 0.8rem; font-weight: 600; color: white; cursor: pointer; transition: 0.2s; }
    .btn-on { background: #2d8f6f; } .btn-off { background: #bf7a7a; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .log-box { margin-top: 1.5rem; background: #1e1e1e; color: #00ff66; font-family: monospace; padding: 10px; border-radius: 8px; height: 90px; overflow-y: auto; font-size: 0.75rem; }
  </style>
</head>
<body>

<div class="glass-card">
  <div class="header">
    <div>
      <div class="title-main">💡 Controle IoT de 4 LEDs</div>
      <span style="font-size: 0.85rem; color: #3d5a73;">Pinos PWM: 11, 10, 9 e 6</span>
    </div>
    <div class="status-pill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Desconectado</span>
    </div>
  </div>

  <!-- VISOR DIGITAL DO POTENCIÔMETRO -->
  <div class="screen-container">
    <span class="screen-label">📟 LEITURA DO POTENCIÔMETRO (A1)</span>
    <div class="digital-display" id="potDisplay">0000</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- BOTOES DE CONTROLE MASTER -->
  <div class="master-controls">
    <span style="font-size: 0.8rem; font-weight: 700; color: #0b2b44; text-transform: uppercase;">⚡ CONTROLE GERAL</span>
    <div class="actions" style="max-width: 350px; margin: 0.5rem auto 0 auto;">
      <button class="btn btn-on btn-control" data-cmd="L" disabled>⚡ LIGAR TODOS</button>
      <button class="btn btn-off btn-control" data-cmd="D" disabled>🚫 DESLIGAR TODOS</button>
    </div>
  </div>

  <!-- GRID COM OS 4 LEDS -->
  <div class="leds-grid">
    <div class="led-card">
      <span style="font-weight: 600; color: #0b2b44; font-size: 0.85rem;">LED 1 (Pino 11)</span>
      <div class="led-circle" id="ledCircle1">Off</div>
      <div class="actions">
        <button class="btn btn-on btn-control" data-cmd="1" disabled>Ligar</button>
        <button class="btn btn-off btn-control" data-cmd="0" disabled>Desligar</button>
      </div>
    </div>

    <div class="led-card">
      <span style="font-weight: 600; color: #0b2b44; font-size: 0.85rem;">LED 2 (Pino 10)</span>
      <div class="led-circle" id="ledCircle2">Off</div>
      <div class="actions">
        <button class="btn btn-on btn-control" data-cmd="11" disabled>Ligar</button>
        <button class="btn btn-off btn-control" data-cmd="00" disabled>Desligar</button>
      </div>
    </div>

    <div class="led-card">
      <span style="font-weight: 600; color: #0b2b44; font-size: 0.85rem;">LED 3 (Pino 9)</span>
      <div class="led-circle" id="ledCircle3">Off</div>
      <div class="actions">
        <button class="btn btn-on btn-control" data-cmd="111" disabled>Ligar</button>
        <button class="btn btn-off btn-control" data-cmd="000" disabled>Desligar</button>
      </div>
    </div>

    <div class="led-card">
      <span style="font-weight: 600; color: #0b2b44; font-size: 0.85rem;">LED 4 (Pino 6)</span>
      <div class="led-circle" id="ledCircle4">Off</div>
      <div class="actions">
        <button class="btn btn-on btn-control" data-cmd="1111" disabled>Ligar</button>
        <button class="btn btn-off btn-control" data-cmd="0000" disabled>Desligar</button>
      </div>
    </div>
  </div>

  <div class="log-box" id="logBox">> Conectando...<br></div>
</div>

<script>
  (function() {
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const controlButtons = document.querySelectorAll('.btn-control');
    const potDisplay = document.getElementById('potDisplay');
    const progressFill = document.getElementById('progressFill');
    const logBox = document.getElementById('logBox');

    const led1 = document.getElementById('ledCircle1');
    const led2 = document.getElementById('ledCircle2');
    const led3 = document.getElementById('ledCircle3');
    const led4 = document.getElementById('ledCircle4');

    let topicComando = "bruno_correa_led_exclusivo/arduino";
    let topicPot = "bruno_correa_led_exclusivo/potenciometro";
    let client = null;

    function addLog(msg) {
      logBox.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setButtonsEnabled(enabled) {
      controlButtons.forEach(btn => btn.disabled = !enabled);
    }

    function updateLedUI(cmd) {
      if (cmd === '1') { led1.className = 'led-circle active-led1'; led1.textContent = 'On'; }
      if (cmd === '0') { led1.className = 'led-circle'; led1.textContent = 'Off'; }

      if (cmd === '11') { led2.className = 'led-circle active-led2'; led2.textContent = 'On'; }
      if (cmd === '00') { led2.className = 'led-circle'; led2.textContent = 'Off'; }

      if (cmd === '111') { led3.className = 'led-circle active-led3'; led3.textContent = 'On'; }
      if (cmd === '000') { led3.className = 'led-circle'; led3.textContent = 'Off'; }

      if (cmd === '1111') { led4.className = 'led-circle active-led4'; led4.textContent = 'On'; }
      if (cmd === '0000') { led4.className = 'led-circle'; led4.textContent = 'Off'; }

      if (cmd === 'L') {
        led1.className = 'led-circle active-led1'; led1.textContent = 'On';
        led2.className = 'led-circle active-led2'; led2.textContent = 'On';
        led3.className = 'led-circle active-led3'; led3.textContent = 'On';
        led4.className = 'led-circle active-led4'; led4.textContent = 'On';
      }
      if (cmd === 'D') {
        led1.className = 'led-circle'; led1.textContent = 'Off';
        led2.className = 'led-circle'; led2.textContent = 'Off';
        led3.className = 'led-circle'; led3.textContent = 'Off';
        led4.className = 'led-circle'; led4.textContent = 'Off';
      }
    }

    function atualizarPotenciometro(valor) {
      potDisplay.innerText = String(valor).padStart(4, '0');
      progressFill.style.width = Math.min(100, Math.max(0, (valor / 1023) * 100)) + '%';

      led1.className = (valor > 50) ? 'led-circle active-led1' : 'led-circle';
      led1.textContent = (valor > 50) ? 'On' : 'Off';

      led2.className = (valor > 250) ? 'led-circle active-led2' : 'led-circle';
      led2.textContent = (valor > 250) ? 'On' : 'Off';

      led3.className = (valor > 500) ? 'led-circle active-led3' : 'led-circle';
      led3.textContent = (valor > 500) ? 'On' : 'Off';

      led4.className = (valor > 750) ? 'led-circle active-led4' : 'led-circle';
      led4.textContent = (valor > 750) ? 'On' : 'Off';
    }

    function connectMqtt() {
      client = new Paho.MQTT.Client('broker.hivemq.com', 8884, 'web_4leds_' + Math.random().toString(16).substring(2, 8));

      client.connect({
        useSSL: true,
        onSuccess: () => {
          statusDot.className = 'status-dot online';
          statusText.innerText = 'Online';
          setButtonsEnabled(true);
          addLog("Conectado ao Broker!");
          client.subscribe(topicComando);
          client.subscribe(topicPot);
        },
        onFailure: (err) => {
          addLog("Erro na conexão: " + err.errorMessage);
          setTimeout(connectMqtt, 5000);
        }
      });

      client.onMessageArrived = (msg) => {
        const payload = msg.payloadString.trim();
        if (msg.destinationName === topicPot && !isNaN(payload)) {
          atualizarPotenciometro(parseInt(payload));
        } else if (msg.destinationName === topicComando) {
          updateLedUI(payload);
        }
      };
    }

    controlButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        const cmd = this.getAttribute('data-cmd');
        const msg = new Paho.MQTT.Message(cmd);
        msg.destinationName = topicComando;
        client.send(msg);
        addLog(`Enviado: '${cmd}'`);
        updateLedUI(cmd);
      });
    });

    connectMqtt();
  })();
</script>
</body>
</html>
