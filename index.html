<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Central IoT Multi-LED</title>
  
  <!-- Paho MQTT via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #d4eaff 0%, #f0f9ff 100%);
      padding: 1.5rem;
    }

    .glass-card {
      max-width: 850px;
      width: 100%;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
      padding: 2rem;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 0.5rem;
    }

    .title-main {
      font-size: 1.8rem;
      font-weight: 600;
      color: #0b2b44;
    }

    .title-sub {
      font-size: 0.9rem;
      color: #3d5a73;
      opacity: 0.8;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.6);
      padding: 0.45rem 1.1rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      font-weight: 500;
      color: #1e2f3f;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fbbf24;
      transition: all 0.3s ease;
    }

    .status-dot.online { background: #10b981; box-shadow: 0 0 10px #10b981; }
    .status-dot.offline { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

    .topic-area { margin-bottom: 1.5rem; }
    .topic-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #2c4b66;
      margin-bottom: 0.4rem;
    }

    .topic-input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 60px;
      font-size: 0.95rem;
      color: #0b2b44;
      outline: none;
    }

    /* Painel de Controle Master */
    .master-controls {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 1.2rem;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .master-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #0b2b44;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Grid com LEDs */
    .leds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
    }

    .led-card {
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 1.5rem;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .led-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0b2b44;
    }

    .led-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #cbdde9;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: #3a5a72;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .led-circle.active-led1 { background: #ef4444; color: white; box-shadow: 0 0 20px rgba(239, 68, 68, 0.8); }
    .led-circle.active-led2 { background: #10b981; color: white; box-shadow: 0 0 20px rgba(16, 185, 129, 0.8); }
    .led-circle.active-led3 { background: #3b82f6; color: white; box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }

    .actions { display: flex; gap: 0.5rem; width: 100%; }

    .btn {
      flex: 1;
      padding: 0.65rem 0.5rem;
      border: none;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 600;
      color: white;
      background: #b0c9dd;
      cursor: not-allowed;
      opacity: 0.5;
      transition: all 0.2s ease;
    }

    .btn.enabled { cursor: pointer; opacity: 1; }
    .btn.enabled:active { transform: scale(0.95); }

    .btn-on { background: #2d8f6f; }
    .btn-on.enabled:hover { background: #1f7a5d; }

    .btn-off { background: #bf7a7a; }
    .btn-off.enabled:hover { background: #ac6363; }

    .log-box {
      margin-top: 1.5rem;
      width: 100%;
      background-color: #1e1e1e;
      color: #00ff66;
      font-family: monospace;
      padding: 12px;
      border-radius: 12px;
      height: 110px;
      overflow-y: auto;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<div class="glass-card">
  <div class="header">
    <div>
      <div class="title-main">💡 Central IoT Multi-LED</div>
      <div class="title-sub">Portas 13, 12 e 11 · Controle Individual e Geral</div>
    </div>
    <div class="status-pill">
      <span class="status-dot offline" id="statusDot"></span>
      <span class="status-text" id="statusText">Desconectado</span>
    </div>
  </div>

  <div class="topic-area">
    <label class="topic-label" for="topicInput">📡 Tópico MQTT</label>
    <input class="topic-input" id="topicInput" type="text" value="bruno_correa_led_exclusivo/arduino" spellcheck="false">
  </div>

  <!-- BOTOES DE CONTROLE GERAL -->
  <div class="master-controls">
    <span class="master-title">⚡ Controle Geral (Todos os LEDs)</span>
    <div class="actions" style="max-width: 420px;">
      <button class="btn btn-on btn-control" data-cmd="4" disabled>⚡ LIGAR TODOS</button>
      <button class="btn btn-off btn-control" data-cmd="c" disabled>🚫 DESLIGAR TODOS</button>
    </div>
  </div>

  <!-- BOTOES INDIVIDUAIS -->
  <div class="leds-grid">
    <div class="led-card">
      <span class="led-title">LED 1 (Pino 13)</span>
      <div class="led-circle" id="ledCircle1">Off</div>
      <div class="actions">
        <button class="btn btn-on btn-control" data-cmd="1" disabled>Ligar</button>
        <button class="btn btn-off btn-control" data-cmd="0" disabled>Desligar</button>
      </div>
    </div>

    <div class="led-card">
      <span class="led-title">LED 2 (Pino 12)</span>
      <div class="led-circle" id="ledCircle2">Off</div>
      <div class="actions">
        <button class="btn btn-on btn-control" data-cmd="11" disabled>Ligar</button>
        <button class="btn btn-off btn-control" data-cmd="00" disabled>Desligar</button>
      </div>
    </div>

    <div class="led-card">
      <span class="led-title">LED 3 (Pino 11)</span>
      <div class="led-circle" id="ledCircle3">Off</div>
      <div class="actions">
        <button class="btn btn-on btn-control" data-cmd="111" disabled>Ligar</button>
        <button class="btn btn-off btn-control" data-cmd="000" disabled>Desligar</button>
      </div>
    </div>
  </div>

  <div class="log-box" id="logBox">> Conectando ao sistema...<br></div>
</div>

<script>
  (function() {
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const topicInput = document.getElementById('topicInput');
    const controlButtons = document.querySelectorAll('.btn-control');
    const logBox = document.getElementById('logBox');

    const led1 = document.getElementById('ledCircle1');
    const led2 = document.getElementById('ledCircle2');
    const led3 = document.getElementById('ledCircle3');

    let currentTopic = topicInput.value.trim();
    let client = null;
    let isConnected = false;

    function addLog(msg) {
      const hora = new Date().toLocaleTimeString();
      logBox.innerHTML += `[${hora}] ${msg}<br>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(mode, msg) {
      statusDot.className = 'status-dot ' + mode;
      statusText.textContent = msg;
    }

    function setButtonsEnabled(enabled) {
      controlButtons.forEach(btn => {
        btn.disabled = !enabled;
        btn.classList.toggle('enabled', enabled);
      });
    }

    function updateLedUI(payload) {
      // Individuais
      if (payload === '1') { led1.className = 'led-circle active-led1'; led1.textContent = 'On'; }
      if (payload === '0') { led1.className = 'led-circle'; led1.textContent = 'Off'; }

      if (payload === '11') { led2.className = 'led-circle active-led2'; led2.textContent = 'On'; }
      if (payload === '00') { led2.className = 'led-circle'; led2.textContent = 'Off'; }

      if (payload === '111') { led3.className = 'led-circle active-led3'; led3.textContent = 'On'; }
      if (payload === '000') { led3.className = 'led-circle'; led3.textContent = 'Off'; }

      // Gerais (4 e c)
      if (payload === '4') {
        led1.className = 'led-circle active-led1'; led1.textContent = 'On';
        led2.className = 'led-circle active-led2'; led2.textContent = 'On';
        led3.className = 'led-circle active-led3'; led3.textContent = 'On';
      }
      if (payload === 'c') {
        led1.className = 'led-circle'; led1.textContent = 'Off';
        led2.className = 'led-circle'; led2.textContent = 'Off';
        led3.className = 'led-circle'; led3.textContent = 'Off';
      }
    }

    function connectMqtt() {
      if (client) { try { client.disconnect(); } catch (_) {} }

      const clientId = 'web_' + Math.random().toString(16).substring(2, 10);
      client = new Paho.MQTT.Client('broker.hivemq.com', 8884, clientId);

      client.connect({
        useSSL: true,
        timeout: 10,
        onSuccess: () => {
          isConnected = true;
          setStatus('online', 'Online');
          setButtonsEnabled(true);
          addLog("Conectado com sucesso!");
          client.subscribe(currentTopic);
        },
        onFailure: (err) => {
          isConnected = false;
          setStatus('offline', 'Erro');
          setButtonsEnabled(false);
          addLog("Falha: " + err.errorMessage);
          setTimeout(connectMqtt, 5000);
        }
      });

      client.onConnectionLost = () => {
        isConnected = false;
        setStatus('offline', 'Desconectado');
        setButtonsEnabled(false);
        addLog("Conexão perdida. Reconectando...");
        setTimeout(connectMqtt, 4000);
      };

      client.onMessageArrived = (msg) => {
        const payload = msg.payloadString.trim();
        addLog(`Recebido: '${payload}'`);
        updateLedUI(payload);
      };
    }

    function publishCommand(cmd) {
      if (!client || !isConnected) return;
      const msg = new Paho.MQTT.Message(cmd);
      msg.destinationName = currentTopic;
      client.send(msg);
      addLog(`Enviado: '${cmd}'`);
      updateLedUI(cmd);
    }

    controlButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        publishCommand(this.getAttribute('data-cmd'));
      });
    });

    topicInput.addEventListener('change', function() {
      const newTopic = this.value.trim();
      if (newTopic && newTopic !== currentTopic && isConnected) {
        client.unsubscribe(currentTopic);
        currentTopic = newTopic;
        client.subscribe(currentTopic);
        addLog(`Novo tópico: '${currentTopic}'`);
      }
    });

    connectMqtt();
  })();
</script>
</body>
</html>
